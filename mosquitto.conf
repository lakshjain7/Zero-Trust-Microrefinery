# Module 6 — Mosquitto broker configuration
# Zero-trust: anonymous connections are refused at the broker level.
# Even if a client connects with valid credentials, the ESP32 performs
# a second layer of HMAC verification — credentials alone are not enough.

listener 1883 0.0.0.0
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
