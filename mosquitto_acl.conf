# Module 6 — Mosquitto ACL file
#
# SECURITY NOTE: attack_demo user is deliberately granted full access
# to refinery/# so the demo can show an attacker reaching the ESP32.
# The second trust layer (HMAC on ESP32) is what blocks the attack —
# not the broker ACL. This demonstrates defense-in-depth: broker ACL
# is the outer perimeter, HMAC is the inner cryptographic gate.
#
# In production: attack_demo user would not exist.

# Legitimate orchestrator node
user refinery_node
topic readwrite refinery/#

# Attack demo user — can reach the broker but ESP32 will reject unsigned payloads
# This is intentional: demonstrates that broker access alone is insufficient
user attack_demo
topic readwrite refinery/#
